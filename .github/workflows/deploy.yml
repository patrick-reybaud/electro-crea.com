# Reconstruit et publie le site à chaque modification de main (dont les enregistrements faits depuis /admin).
# Secrets à définir dans le dépôt : FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_REMOTE_DIR.
name: Publier sur OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Sans secrets FTP (dépôt fraîchement créé), on vérifie seulement que le site se construit.
      - name: Build seul
        if: env.FTP_HOST == ''
        run: npm run build
      - if: env.FTP_HOST != ''
        run: sudo apt-get update && sudo apt-get install -y lftp
      - if: env.FTP_HOST != ''
        run: scripts/deploy_ovh.sh
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
